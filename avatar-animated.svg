<svg xmlns="http://www.w3.org/2000/svg" width="760" height="520" viewBox="0 0 760 520" role="img" aria-labelledby="title desc">
<title id="title">Animated terminal avatar for Pranjal T S</title>
<desc id="desc">A colorful morphing sphere animates inside a dark terminal window.</desc>
<defs>
  <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#111827"/><stop offset="1" stop-color="#050816"/></linearGradient>
  <radialGradient id="orb" cx="35%" cy="28%"><stop stop-color="#f9a8d4"/><stop offset=".35" stop-color="#a78bfa"/><stop offset=".7" stop-color="#22d3ee"/><stop offset="1" stop-color="#2563eb"/></radialGradient>
  <filter id="glow"><feGaussianBlur stdDeviation="8" result="b"/><feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge></filter>
  <clipPath id="screen"><rect x="24" y="72" width="712" height="424" rx="0"/></clipPath>
</defs>
<rect width="760" height="520" rx="22" fill="#0b1020" stroke="#374151" stroke-width="3"/>
<rect x="2" y="2" width="756" height="54" rx="20" fill="#151b2d"/>
<rect x="2" y="34" width="756" height="22" fill="#151b2d"/>
<circle cx="30" cy="28" r="8" fill="#ff5f57"/><circle cx="56" cy="28" r="8" fill="#febc2e"/><circle cx="82" cy="28" r="8" fill="#28c840"/>
<text x="380" y="34" text-anchor="middle" fill="#9ca3af" font-family="monospace" font-size="16">pranjal@github:~$ ./avatar.sh</text>
<rect x="24" y="72" width="712" height="424" fill="url(#bg)"/>
<g clip-path="url(#screen)">
  <g transform="translate(380 270)" filter="url(#glow)">
    <ellipse rx="128" ry="128" fill="url(#orb)" opacity=".95">
      <animateTransform attributeName="transform" type="rotate" from="0" to="360" dur="8s" repeatCount="indefinite"/>
      <animate attributeName="rx" values="128;150;112;128" dur="4s" repeatCount="indefinite"/>
      <animate attributeName="ry" values="128;108;148;128" dur="4s" repeatCount="indefinite"/>
    </ellipse>
    <ellipse rx="86" ry="128" fill="none" stroke="#fef3c7" stroke-opacity=".65" stroke-width="8">
      <animateTransform attributeName="transform" type="rotate" from="0" to="360" dur="5s" repeatCount="indefinite"/>
    </ellipse>
    <ellipse rx="128" ry="54" fill="none" stroke="#67e8f9" stroke-opacity=".72" stroke-width="7">
      <animateTransform attributeName="transform" type="rotate" from="0" to="-360" dur="6s" repeatCount="indefinite"/>
    </ellipse>
    <circle cx="-38" cy="-48" r="18" fill="#fff" opacity=".8"><animate attributeName="cx" values="-38;-15;-38" dur="3s" repeatCount="indefinite"/></circle>
  </g>
  <text x="48" y="454" fill="#9ca3af" font-family="monospace" font-size="17">pranjal@github:~$ whoami</text>
  <text x="285" y="454" fill="#e5e7eb" font-family="monospace" font-size="17">Pranjal T S</text>
  <rect x="410" y="438" width="11" height="22" fill="#e5e7eb"><animate attributeName="opacity" values="1;0;1" dur="1s" repeatCount="indefinite"/></rect>
</g>
</svg>
