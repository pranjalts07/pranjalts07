<svg xmlns="http://www.w3.org/2000/svg" width="480" height="396" viewBox="0 0 480 396" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" role="img" aria-labelledby="title desc"><title id="title">Animated avatar terminal for Pranjal T S</title><desc id="desc">A colorful sphere rotates and morphs inside a terminal card matching the adjacent profile card.</desc><defs><linearGradient id="ibg" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#111722"/><stop offset="1" stop-color="#0d1117"/></linearGradient><radialGradient id="orb" cx="35%" cy="28%"><stop stop-color="#f9a8d4"/><stop offset=".35" stop-color="#a78bfa"/><stop offset=".7" stop-color="#22d3ee"/><stop offset="1" stop-color="#2563eb"/></radialGradient><filter id="glow"><feGaussianBlur stdDeviation="6" result="b"/><feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge></filter><clipPath id="screen"><rect x="0" y="31" width="480" height="365"/></clipPath></defs><rect width="480" height="396" rx="12" fill="url(#ibg)"/><rect x="0.5" y="0.5" width="479" height="395" rx="12" fill="none" stroke="#30363d"/><line x1="0" y1="30" x2="480" y2="30" stroke="#30363d"/><circle cx="20" cy="15" r="5" fill="#ff5f56"/><circle cx="36" cy="15" r="5" fill="#ffbd2e"/><circle cx="52" cy="15" r="5" fill="#27c93f"/><text x="240" y="19" fill="#7d8590" font-size="12" text-anchor="middle">pranjal@github: ~$ avatar.sh</text><g clip-path="url(#screen)"><g opacity="0" transform="translate(0,5)"><g transform="translate(240 190)" filter="url(#glow)"><ellipse rx="92" ry="92" fill="url(#orb)" opacity=".95"><animateTransform attributeName="transform" type="rotate" from="0" to="360" dur="8s" repeatCount="indefinite"/><animate attributeName="rx" values="92;106;80;92" dur="4s" repeatCount="indefinite"/><animate attributeName="ry" values="92;78;106;92" dur="4s" repeatCount="indefinite"/></ellipse><ellipse rx="62" ry="92" fill="none" stroke="#fef3c7" stroke-opacity=".65" stroke-width="6"><animateTransform attributeName="transform" type="rotate" from="0" to="360" dur="5s" repeatCount="indefinite"/></ellipse><ellipse rx="92" ry="39" fill="none" stroke="#67e8f9" stroke-opacity=".72" stroke-width="5"><animateTransform attributeName="transform" type="rotate" from="0" to="-360" dur="6s" repeatCount="indefinite"/></ellipse><circle cx="-27" cy="-34" r="13" fill="#fff" opacity=".8"><animate attributeName="cx" values="-27;-10;-27" dur="3s" repeatCount="indefinite"/></circle></g><animate attributeName="opacity" from="0" to="1" begin="0.15s" dur="0.4s" fill="freeze"/><animateTransform attributeName="transform" type="translate" from="0 5" to="0 0" begin="0.15s" dur="0.4s" fill="freeze" calcMode="spline" keySplines="0.2 0.8 0.2 1"/></g><text x="20" y="367" fill="#7d8590" font-size="12">pranjal@github:~$ whoami  Pranjal T S</text><rect x="292" y="355" width="7" height="15" fill="#c9d1d9"><animate attributeName="opacity" values="1;0;1" dur="1s" repeatCount="indefinite"/></rect></g></svg>
