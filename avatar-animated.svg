<svg xmlns="http://www.w3.org/2000/svg" width="480" height="396" viewBox="0 0 480 396" role="img" aria-labelledby="title desc">
<title id="title">Animated terminal avatar for Pranjal T S</title>
<desc id="desc">A colorful morphing sphere animates inside a dark terminal window.</desc>
<defs>
  <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#111827"/><stop offset="1" stop-color="#050816"/></linearGradient>
  <radialGradient id="orb" cx="35%" cy="28%"><stop stop-color="#f9a8d4"/><stop offset=".35" stop-color="#a78bfa"/><stop offset=".7" stop-color="#22d3ee"/><stop offset="1" stop-color="#2563eb"/></radialGradient>
  <filter id="glow"><feGaussianBlur stdDeviation="6" result="b"/><feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge></filter>
  <clipPath id="screen"><rect x="16" y="56" width="448" height="324"/></clipPath>
</defs>
<rect width="480" height="396" rx="16" fill="#0b1020" stroke="#374151" stroke-width="2"/>
<rect x="1" y="1" width="478" height="42" rx="15" fill="#151b2d"/><rect x="1" y="26" width="478" height="17" fill="#151b2d"/>
<circle cx="24" cy="22" r="6" fill="#ff5f57"/><circle cx="44" cy="22" r="6" fill="#febc2e"/><circle cx="64" cy="22" r="6" fill="#28c840"/>
<text x="240" y="27" text-anchor="middle" fill="#9ca3af" font-family="monospace" font-size="11">pranjal@github:~$ ./avatar.sh</text>
<rect x="16" y="56" width="448" height="324" fill="url(#bg)"/>
<g clip-path="url(#screen)">
  <g transform="translate(240 200)" filter="url(#glow)">
    <ellipse rx="92" ry="92" fill="url(#orb)" opacity=".95"><animateTransform attributeName="transform" type="rotate" from="0" to="360" dur="8s" repeatCount="indefinite"/><animate attributeName="rx" values="92;106;80;92" dur="4s" repeatCount="indefinite"/><animate attributeName="ry" values="92;78;106;92" dur="4s" repeatCount="indefinite"/></ellipse>
    <ellipse rx="62" ry="92" fill="none" stroke="#fef3c7" stroke-opacity=".65" stroke-width="6"><animateTransform attributeName="transform" type="rotate" from="0" to="360" dur="5s" repeatCount="indefinite"/></ellipse>
    <ellipse rx="92" ry="39" fill="none" stroke="#67e8f9" stroke-opacity=".72" stroke-width="5"><animateTransform attributeName="transform" type="rotate" from="0" to="-360" dur="6s" repeatCount="indefinite"/></ellipse>
    <circle cx="-27" cy="-34" r="13" fill="#fff" opacity=".8"><animate attributeName="cx" values="-27;-10;-27" dur="3s" repeatCount="indefinite"/></circle>
  </g>
  <text x="32" y="352" fill="#9ca3af" font-family="monospace" font-size="11">pranjal@github:~$ whoami</text><text x="190" y="352" fill="#e5e7eb" font-family="monospace" font-size="11">Pranjal T S</text><rect x="270" y="342" width="7" height="14" fill="#e5e7eb"><animate attributeName="opacity" values="1;0;1" dur="1s" repeatCount="indefinite"/></rect>
</g>
</svg>
